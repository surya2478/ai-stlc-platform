<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">STLC Platform system architecture</title>
  <desc id="desc">Evidence-aware architecture diagram showing users, a Next.js frontend, a Python ASGI API, domain services, an AI-assisted testing pipeline, document processors, OpenAI, and inferred persistence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#101c2f"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153f5a"/>
      <stop offset="1" stop-color="#112f47"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21385d"/>
      <stop offset="1" stop-color="#162846"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a275a"/>
      <stop offset="1" stop-color="#25203f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#63d7f4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#b99cff"/>
    </marker>
    <marker id="arrowMuted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 z" fill="#92a5bd"/>
    </marker>
    <style>
      .title { font: 700 42px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; letter-spacing: .3px; }
      .subtitle { font: 400 18px "Segoe UI", Arial, sans-serif; fill: #aebdd1; }
      .section { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #f4f8ff; letter-spacing: 1.3px; }
      .card-title { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #f7fbff; }
      .card-sub { font: 500 14px "Segoe UI", Arial, sans-serif; fill: #9db1c9; letter-spacing: .4px; }
      .body { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #dfe9f5; }
      .small { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #afc0d3; }
      .tiny { font: 400 12px "Segoe UI", Arial, sans-serif; fill: #91a6bf; }
      .chip { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #d9f7ff; letter-spacing: .3px; }
      .endpoint { font: 600 13px Consolas, "Courier New", monospace; fill: #dbe9ff; }
      .note-title { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #ffe7a3; }
      .note { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #efdca9; }
      .layer { fill: #0e1b2d; stroke: #2a405a; stroke-width: 1.5; }
      .group { fill: rgba(19,35,56,.72); stroke: #314b69; stroke-width: 1.5; }
      .solid-card { stroke: #547393; stroke-width: 1.6; }
      .inferred-card { stroke: #7890a8; stroke-width: 1.6; stroke-dasharray: 9 7; }
      .divider { stroke: #34506d; stroke-width: 1; }
      .flow { fill: none; stroke: #63d7f4; stroke-width: 2.6; marker-end: url(#arrowCyan); }
      .flow-bi { fill: none; stroke: #63d7f4; stroke-width: 2.6; marker-start: url(#arrowCyan); marker-end: url(#arrowCyan); }
      .ai-flow { fill: none; stroke: #b99cff; stroke-width: 2.6; marker-end: url(#arrowPurple); }
      .muted-flow { fill: none; stroke: #92a5bd; stroke-width: 2.2; marker-end: url(#arrowMuted); }
      .dashed-flow { fill: none; stroke: #92a5bd; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowMuted); }
    </style>
  </defs>

  <rect width="1800" height="1220" fill="url(#bg)"/>
  <circle cx="1550" cy="120" r="260" fill="#3f2e74" opacity=".11"/>
  <circle cx="230" cy="1040" r="300" fill="#087b9b" opacity=".09"/>

  <text x="72" y="72" class="title">STLC Platform — System Architecture</text>
  <text x="72" y="106" class="subtitle">Evidence-aware reconstruction from the current workspace snapshot and observable runtime/dependency metadata</text>

  <!-- User / entry -->
  <rect x="72" y="150" width="1656" height="112" rx="20" class="layer"/>
  <text x="96" y="181" class="section">EXPERIENCE &amp; ENTRY</text>
  <g filter="url(#shadow)">
    <rect x="112" y="196" width="270" height="48" rx="13" fill="#143049" stroke="#4b6986"/>
    <circle cx="142" cy="220" r="10" fill="none" stroke="#63d7f4" stroke-width="2"/>
    <path d="M127 238 Q142 224 157 238" fill="none" stroke="#63d7f4" stroke-width="2"/>
    <text x="172" y="226" class="body">QA Engineer / Test Lead</text>
  </g>
  <path d="M382 220 H505" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="520" y="196" width="280" height="48" rx="13" fill="#143049" stroke="#4b6986"/>
    <rect x="546" y="207" width="27" height="21" rx="3" fill="none" stroke="#63d7f4" stroke-width="2"/>
    <line x1="546" y1="213" x2="573" y2="213" stroke="#63d7f4" stroke-width="2"/>
    <text x="591" y="226" class="body">Web Browser</text>
  </g>
  <path d="M800 220 H944" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="960" y="196" width="300" height="48" rx="13" fill="#143049" stroke="#4b6986"/>
    <text x="988" y="226" class="body">Next.js web application</text>
    <text x="1210" y="226" class="chip">:3000</text>
  </g>
  <path d="M1260 220 H1393" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="1410" y="196" width="270" height="48" rx="13" fill="#143049" stroke="#4b6986"/>
    <text x="1438" y="226" class="body">REST / JSON API</text>
    <text x="1624" y="226" class="chip">:8000</text>
  </g>

  <!-- Platform boundary -->
  <rect x="72" y="290" width="1656" height="680" rx="24" fill="#0a1626" stroke="#3b536e" stroke-width="2"/>
  <text x="96" y="326" class="section">STLC PLATFORM • LOCAL / CONTAINERIZED RUNTIME</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="100" y="352" width="510" height="572" rx="20" fill="url(#frontendGrad)" class="solid-card"/>
  </g>
  <text x="130" y="390" class="card-title">Frontend — Presentation Layer</text>
  <text x="130" y="414" class="card-sub">NEXT.JS • REACT • TAILWIND • RADIX UI</text>

  <rect x="130" y="446" width="450" height="72" rx="13" fill="#10273b" stroke="#3f607e"/>
  <text x="154" y="476" class="body">Project workspace &amp; navigation</text>
  <text x="154" y="500" class="small">Select project • view lifecycle state • coordinate assets</text>

  <rect x="130" y="532" width="450" height="72" rx="13" fill="#10273b" stroke="#3f607e"/>
  <text x="154" y="562" class="body">Requirements &amp; document views</text>
  <text x="154" y="586" class="small">Upload, inspect, link, and review project inputs</text>

  <rect x="130" y="618" width="450" height="72" rx="13" fill="#10273b" stroke="#3f607e"/>
  <text x="154" y="648" class="body">Test execution dashboard</text>
  <text x="154" y="672" class="small">Execution controls • status • results • console feedback</text>

  <rect x="130" y="704" width="450" height="72" rx="13" fill="#10273b" stroke="#3f607e"/>
  <text x="154" y="734" class="body">Forms, validation &amp; data visualization</text>
  <text x="154" y="758" class="small">React Hook Form • resolver validation • Victory charts</text>

  <rect x="130" y="804" width="450" height="82" rx="13" fill="#0d2235" stroke="#3d5b77"/>
  <text x="154" y="835" class="body">API client &amp; authenticated session</text>
  <text x="154" y="861" class="endpoint">Bearer token → /api/v1/*</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="650" y="352" width="590" height="572" rx="20" fill="url(#backendGrad)" class="solid-card"/>
  </g>
  <text x="680" y="390" class="card-title">Backend — Application &amp; Domain API</text>
  <text x="680" y="414" class="card-sub">PYTHON ASGI • UVICORN • PYDANTIC</text>

  <rect x="680" y="446" width="530" height="90" rx="13" fill="#14243d" stroke="#4c6284"/>
  <text x="704" y="475" class="body">API routes, authentication &amp; validation</text>
  <text x="704" y="500" class="endpoint">POST /api/v1/users/token</text>
  <text x="974" y="500" class="small">→ access token</text>
  <text x="704" y="522" class="small">Request models • rate limits • cryptographic utilities</text>

  <rect x="680" y="550" width="255" height="88" rx="13" fill="#14243d" stroke="#4c6284"/>
  <text x="704" y="580" class="body">Project service</text>
  <text x="704" y="607" class="endpoint">GET /projects/</text>
  <text x="704" y="628" class="tiny">Project context &amp; lifecycle</text>

  <rect x="955" y="550" width="255" height="88" rx="13" fill="#14243d" stroke="#4c6284"/>
  <text x="979" y="580" class="body">Requirement service</text>
  <text x="979" y="607" class="endpoint">GET /requirements/project/:id</text>
  <text x="979" y="628" class="tiny">Traceability &amp; analysis inputs</text>

  <rect x="680" y="652" width="255" height="88" rx="13" fill="#14243d" stroke="#4c6284"/>
  <text x="704" y="682" class="body">Document service</text>
  <text x="704" y="709" class="endpoint">GET /documents/project/:id</text>
  <text x="704" y="730" class="tiny">Upload &amp; content metadata</text>

  <rect x="955" y="652" width="255" height="88" rx="13" fill="#14243d" stroke="#4c6284"/>
  <text x="979" y="682" class="body">Execution service</text>
  <text x="979" y="709" class="endpoint">runs → status → results</text>
  <text x="979" y="730" class="tiny">Orchestrates test execution flow</text>

  <rect x="680" y="770" width="530" height="116" rx="13" fill="#111f35" stroke="#4c6284"/>
  <text x="704" y="800" class="body">Application workflow</text>
  <circle cx="724" cy="837" r="12" fill="#2a5873"/><text x="720" y="842" class="chip">1</text>
  <text x="747" y="842" class="small">ingest</text>
  <path d="M798 837 H829" class="muted-flow"/>
  <circle cx="850" cy="837" r="12" fill="#2a5873"/><text x="846" y="842" class="chip">2</text>
  <text x="873" y="842" class="small">normalize</text>
  <path d="M951 837 H982" class="muted-flow"/>
  <circle cx="1003" cy="837" r="12" fill="#563c79"/><text x="999" y="842" class="chip">3</text>
  <text x="1026" y="842" class="small">generate / analyze</text>
  <path d="M1154 837 H1180" class="muted-flow"/>
  <text x="704" y="872" class="small">persist artifacts, execute tests, and return traceable results</text>

  <!-- API connection -->
  <path d="M610 835 H650" class="flow-bi"/>
  <text x="617" y="815" class="tiny">JSON</text>

  <!-- AI / processors -->
  <g filter="url(#shadow)">
    <rect x="1280" y="352" width="420" height="572" rx="20" fill="url(#aiGrad)" class="solid-card"/>
  </g>
  <text x="1310" y="390" class="card-title">AI &amp; Content Capabilities</text>
  <text x="1310" y="414" class="card-sub">ORCHESTRATION • PROCESSING • GENERATION</text>

  <rect x="1310" y="446" width="360" height="92" rx="13" fill="#231c38" stroke="#6e5b93"/>
  <text x="1334" y="476" class="body">AI orchestration</text>
  <text x="1334" y="502" class="small">LangChain Classic • LangGraph SDK</text>
  <text x="1334" y="524" class="tiny">Prompting, multi-step flows, structured outputs</text>

  <rect x="1310" y="552" width="360" height="88" rx="13" fill="#231c38" stroke="#6e5b93"/>
  <text x="1334" y="582" class="body">OpenAI client</text>
  <text x="1334" y="608" class="small">Model inference for generation and analysis</text>
  <circle cx="1644" cy="582" r="8" fill="#b99cff" filter="url(#softGlow)"/>

  <rect x="1310" y="654" width="360" height="106" rx="13" fill="#231c38" stroke="#6e5b93"/>
  <text x="1334" y="684" class="body">Document &amp; spreadsheet processing</text>
  <text x="1334" y="710" class="small">python-docx • openpyxl</text>
  <text x="1334" y="734" class="small">DOCX / XLSX parsing and artifact generation</text>

  <rect x="1310" y="774" width="360" height="112" rx="13" fill="#231c38" stroke="#6e5b93"/>
  <text x="1334" y="804" class="body">Test data utilities</text>
  <text x="1334" y="830" class="small">Faker • NumPy</text>
  <text x="1334" y="854" class="small">Synthetic inputs and data transformations</text>

  <path d="M1240 500 H1280" class="ai-flow"/>
  <path d="M1240 696 H1280" class="ai-flow"/>
  <path d="M1280 831 H1240" class="ai-flow"/>

  <!-- Data and external systems -->
  <rect x="72" y="998" width="1656" height="154" rx="20" class="layer"/>
  <text x="96" y="1031" class="section">DATA &amp; EXTERNAL SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="112" y="1051" width="310" height="70" rx="14" fill="#122439" stroke="#4b6986"/>
    <text x="138" y="1081" class="body">Input files</text>
    <text x="138" y="1105" class="small">Requirements • DOCX • XLSX</text>
  </g>
  <path d="M422 1086 C515 1086 520 944 680 875" class="muted-flow"/>

  <g filter="url(#shadow)">
    <rect x="540" y="1051" width="360" height="70" rx="14" fill="#122439" class="inferred-card"/>
    <text x="566" y="1081" class="body">Project persistence</text>
    <text x="566" y="1105" class="small">Store technology not observable in snapshot</text>
  </g>
  <path d="M850 1051 V924" class="dashed-flow"/>

  <g filter="url(#shadow)">
    <rect x="1015" y="1051" width="330" height="70" rx="14" fill="#1f1a32" stroke="#6e5b93"/>
    <text x="1041" y="1081" class="body">OpenAI API</text>
    <text x="1041" y="1105" class="small">External model provider</text>
  </g>
  <path d="M1345 1086 C1460 1086 1490 992 1490 924" class="ai-flow"/>

  <g filter="url(#shadow)">
    <rect x="1450" y="1051" width="238" height="70" rx="14" fill="#122439" class="inferred-card"/>
    <text x="1476" y="1081" class="body">Reports / artifacts</text>
    <text x="1476" y="1105" class="small">Generated outputs</text>
  </g>
  <path d="M1450 1086 C1384 1086 1324 987 1210 874" class="dashed-flow"/>

  <!-- Evidence note -->
  <rect x="72" y="1170" width="1035" height="34" rx="9" fill="#2d2819" stroke="#6f6137"/>
  <text x="90" y="1192" class="note-title">Snapshot constraint:</text>
  <text x="252" y="1192" class="note">source, manifests, Compose config, and DB schema are absent; dashed elements are inferred.</text>

  <line x1="1160" y1="1187" x2="1205" y2="1187" stroke="#63d7f4" stroke-width="3"/>
  <text x="1218" y="1192" class="small">observed / evidenced</text>
  <line x1="1424" y1="1187" x2="1469" y2="1187" stroke="#92a5bd" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="1482" y="1192" class="small">inferred / unverified</text>
</svg>
