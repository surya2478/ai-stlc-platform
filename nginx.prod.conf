# Production nginx config — mounted by docker-compose.prod.yml at
# /etc/nginx/nginx.conf. The dev nginx.conf is not usable here: it pins
# server_name to localhost and points at the self-signed pair in certs/.
#
# Two things must be set up on the host before this works:
#
#   1. TLS material in ./certs, named exactly:
#        certs/fullchain.pem   (certificate + intermediates)
#        certs/privkey.pem     (private key)
#      Let's Encrypt writes both under that name in
#      /etc/letsencrypt/live/<domain>/. The directory is mounted read-only.
#
#   2. server_name below, replaced with the real hostname. It is left as `_`
#      (catch-all) so a first deploy answers on whatever address it is given
#      rather than failing closed on a name mismatch — but a real name is what
#      makes HSTS and certificate validation mean anything.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Uploads are capped at MAX_UPLOAD_SIZE_MB (25) by the backend. Nginx's own
    # default is 1m, which would reject anything larger with a 413 before the
    # request ever reached the API — a size limit enforced in the wrong place
    # and with the wrong error.
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP: redirect, plus the two things that must stay on port 80 ─────────
    server {
        listen 80;
        server_name _;

        # The compose healthcheck runs `curl -sf http://localhost/healthz`.
        # Served here rather than left to the redirect so the check reports on
        # nginx itself instead of passing on a 301 it never follows.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ACME http-01 renewal. Inert until a webroot is mounted into this
        # service (add `- certbot_webroot:/var/www/certbot` to the nginx
        # volumes); harmless if you renew by DNS-01 or out of band instead.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # The published HTTPS port is 12443, not 443, because 443 is taken
            # on this host. A bare `https://$host` redirect would send every
            # visitor to a port nothing listens on, so the port is spelled out.
            # Keep this in step with HTTPS_PORT in the compose files, and drop
            # the ":12443" if you ever move back to 443 or put a load balancer
            # in front that terminates on it.
            return 301 https://$host:12443$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # `always` so they survive error responses too, which is where a
        # missing X-Frame-Options actually matters.
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Agent runs, Jira imports and suite dispatches are synchronous
            # request/response calls that routinely outlast nginx's 60s default,
            # which would surface as a 504 while the work carried on server-side.
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Execution evidence (video, trace, screenshots) is served through
            # this prefix. Buffering it means writing the whole artifact to a
            # temp file before the first byte reaches the client.
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
