services:
  # ── Datastores ──────────────────────────────────────────────────────────────
  # Loopback-only publishing for psql and redis-cli from the host. Local
  # convenience, so it belongs here: the production stack never loads this
  # file and therefore never binds these ports at all.
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    # 8000 is off-limits on the shared host, so the API is published on
    # BACKEND_PORT (default 8400). The container still listens on 8000, which
    # is what nginx and INTERNAL_API_URL address over the compose network.
    ports:
      - "${BACKEND_PORT:-8400}:8000"
    volumes:
      - ./backend:/app
      - stlc_storage:/app/storage
      - .:/repo
    # --reload-dir scopes the watcher to the Python package. Without it the
    # watcher covers all of /app, which includes storage/automation_workspace —
    # where every dry run materializes a workspace and symlinks node_modules to
    # the npm global root. Watching that reloads the backend mid-run on the
    # thousands of files under node_modules (observed live: a dry run for
    # script 102 restarted the API while it was executing).
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    volumes:
      - ./backend:/app
      - stlc_storage:/app/storage
      - .:/repo

  # ── Static Test Target ──────────────────────────────────────────────────────
  # A deterministic multi-page site to run automation against, so a governed run
  # is not at the mercy of a third party's uptime. An external outage blocks a
  # run before it starts and, mid-run, is hard to distinguish from a real
  # application defect; a target we control removes that ambiguity.
  #
  # Local only: it lives here rather than in docker-compose.yml because that
  # file is also half of the production stack, and production has no business
  # running a test fixture. Compose loads this override automatically for a bare
  # `docker compose up`, and not when the prod file is passed with -f.
  #
  # The only service on both networks. `test_targets` is what spawned runner
  # containers join, and it deliberately does NOT include db, redis, backend or
  # runner-executor: untrusted generated test code should be able to reach the
  # thing under test and nothing else in the deployment.
  static-test:
    image: nginx:alpine
    container_name: stlc_static_test
    restart: unless-stopped
    volumes:
      - ./fixtures/static-site:/usr/share/nginx/html:ro
    ports:
      # Loopback only — a fixture, not something to expose on the network.
      - "127.0.0.1:8080:80"
    networks:
      - default
      - test_targets

  # ── Nginx Proxy ─────────────────────────────────────────────────────────────
  # Publishing lives here rather than in docker-compose.yml so the production
  # file set can publish a different set of ports — Compose cannot subtract a
  # port declared in the base. Development still serves HTTPS from nginx.conf
  # and the self-signed pair in certs/.
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-12443}:443"

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    # 3000 is off-limits on the shared host, so the dev server is published on
    # FRONTEND_PORT (default 4300). The container still listens on 3000.
    ports:
      - "${FRONTEND_PORT:-4300}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Native fs events from a Windows bind mount don't reliably reach the
      # Linux container, so Next's default watcher silently misses file
      # saves and keeps serving a stale compiled bundle. Force polling.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
