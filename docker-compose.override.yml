services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - stlc_storage:/app/storage
      - .:/repo
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    volumes:
      - ./backend:/app
      - stlc_storage:/app/storage
      - .:/repo

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Native fs events from a Windows bind mount don't reliably reach the
      # Linux container, so Next's default watcher silently misses file
      # saves and keeps serving a stale compiled bundle. Force polling.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev
