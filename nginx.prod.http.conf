# Production nginx config for an HTTP-only deployment — mounted by
# docker-compose.prod.yml at /etc/nginx/nginx.conf.
#
# This is nginx.prod.conf with TLS removed: the port-80 server proxies the
# application directly instead of redirecting to 12443, there are no ssl_*
# directives and no certificates to install, and Strict-Transport-Security is
# deliberately absent (see the note on the header block below).
#
# What this costs: session cookies, login credentials and every JWT cross the
# network in cleartext. SESSION_COOKIE_SECURE=false in .env is what allows the
# browser to keep those cookies at all. Run this only on a closed internal
# segment or behind a VPN, never on anything routable from outside.
#
# To go back to TLS: point the nginx volume in docker-compose.prod.yml back at
# nginx.prod.conf, restore the HTTPS_PORT publish on that service, unset
# SESSION_COOKIE_SECURE, and restore the HSTS headers in backend/app/main.py
# and frontend/next.config.js.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Uploads are capped at MAX_UPLOAD_SIZE_MB (25) by the backend. Nginx's own
    # default is 1m, which would reject anything larger with a 413 before the
    # request ever reached the API — a size limit enforced in the wrong place
    # and with the wrong error.
    client_max_body_size 25m;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # `always` so they survive error responses too, which is where a
        # missing X-Frame-Options actually matters.
        #
        # Strict-Transport-Security is NOT sent here. A browser ignores it when
        # it arrives over HTTP, and emitting it poisons any browser that later
        # reaches this host over TLS: that browser force-upgrades every http://
        # visit afterwards, to a port nothing listens on.
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # The compose healthcheck runs `curl -sf http://localhost/healthz`.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Agent runs, Jira imports and suite dispatches are synchronous
            # request/response calls that routinely outlast nginx's 60s default,
            # which would surface as a 504 while the work carried on server-side.
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Execution evidence (video, trace, screenshots) is served through
            # this prefix. Buffering it means writing the whole artifact to a
            # temp file before the first byte reaches the client.
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
