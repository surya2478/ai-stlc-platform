services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: stlc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stlc_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm}
      POSTGRES_DB: ${POSTGRES_DB:-stlc_agents}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stlc_local}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stlc_redis
    restart: unless-stopped
    command: redis-server --requirepass 30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm --appendonly yes --save 60 1
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stlc_backend
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://stlc_local:30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm@db:5432/stlc_agents}
      REDIS_URL: ${REDIS_URL:-redis://:30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm@redis:6379/0}
    volumes:
      - stlc_storage:/app/storage
      - .:/repo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stlc_worker
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://stlc_local:30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm@db:5432/stlc_agents}
      REDIS_URL: ${REDIS_URL:-redis://:30Yt-n1ESxols_rl6Zc3fbD7pMwRZmxm@redis:6379/0}
      DB_POOL_ENABLED: "false"
    volumes:
      - stlc_storage:/app/storage
      - .:/repo
      # Playwright AI Studio "docker" runner mode: the worker spawns
      # ephemeral sibling runner containers through the host's Docker
      # daemon. Runner containers mount the same stlc_storage volume, so
      # script workspaces resolve at identical paths inside them.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4


  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stlc_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_ENABLE_DEV_AUTH: ${NEXT_PUBLIC_ENABLE_DEV_AUTH:-false}
    depends_on:
      - backend

  # ── Nginx Proxy (HTTPS) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stlc_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  pg_data:
  redis_data:
  stlc_storage:
