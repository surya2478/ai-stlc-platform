services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: stlc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stlc_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-stlc_agents}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Publishing lives in docker-compose.override.yml. `ports: []` in the
    # production override does NOT remove these — Compose appends list
    # values rather than replacing them — so a binding declared here is
    # published in production too, contradicting what that file says.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stlc_local}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stlc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --appendonly yes --save 60 1
    # Publishing lives in docker-compose.override.yml — see the note on db.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stlc_backend
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
    volumes:
      - stlc_storage:/app/storage
      - .:/repo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stlc_worker
    restart: unless-stopped
    user: "root"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      DB_POOL_ENABLED: "false"
    volumes:
      - stlc_storage:/app/storage
      - .:/repo
      # The Docker socket is deliberately NOT mounted here (AUT-002). Daemon
      # access is host-level authority, and the worker — which runs
      # LLM-generated code paths and holds database, Redis and LLM credentials —
      # is the worst process in the deployment to hold it. Runner containers are
      # created by the `runner-executor` service instead; set
      # AUTOMATION_RUNNER_MODE=executor to use it.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --beat embeds the scheduler in this worker. Without it `beat_schedule`
    # in celery_app.py is dead config locally: production runs a dedicated
    # `beat` service (docker-compose.prod.yml) but development had no beat
    # process at all, so neither the nightly retention sweep nor the abandoned
    # agent-run reaper ever fired here. Safe embedded because this compose
    # runs exactly one worker; scaling it would need the separate service
    # instead, or every replica would run the schedule.
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4 --beat

  # ── Runner Executor ─────────────────────────────────────────────────────────
  # The only service that touches the Docker daemon (AUT-002). It exposes one
  # typed operation — run this materialized workspace as a test — and builds the
  # sandbox flags itself, so a caller cannot request a privileged container, a
  # different image, or an arbitrary mount.
  #
  # Deliberately credential-free: no DATABASE_URL, no REDIS_URL, no LLM keys.
  # The only secret it needs is the token proving a request came from inside the
  # deployment. It is not published to the host; only the compose network can
  # reach it.
  runner-executor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stlc_runner_executor
    restart: unless-stopped
    # Root is load-bearing here and nowhere else: the executor chowns each
    # workspace to the unprivileged uid the runner container executes as.
    user: "root"
    environment:
      APP_ENV: ${APP_ENV:-local}
      # A literal, deliberately NOT ${APP_SECRET_KEY}. Settings validation wants
      # a non-placeholder key of sufficient length in production, but this
      # service signs nothing and authenticates nobody — handing it the real
      # application secret would give away the credential-free property that is
      # the reason it exists.
      APP_SECRET_KEY: "executor-does-not-sign-anything-unused-placeholder"
      AUTOMATION_EXECUTOR_TOKEN: ${AUTOMATION_EXECUTOR_TOKEN:?set AUTOMATION_EXECUTOR_TOKEN in .env}
      AUTOMATION_DOCKER_IMAGE: ${AUTOMATION_DOCKER_IMAGE:-stlc-platform-worker}
      AUTOMATION_DOCKER_VOLUME: ${AUTOMATION_DOCKER_VOLUME:-stlc-platform_stlc_storage}
      AUTOMATION_DOCKER_STORAGE_MOUNT: ${AUTOMATION_DOCKER_STORAGE_MOUNT:-/app/storage}
      AUTOMATION_DOCKER_NETWORK: ${AUTOMATION_DOCKER_NETWORK:-}
      DB_POOL_ENABLED: "false"
    volumes:
      # Same source mount as backend and worker. Without it the executor runs
      # whatever code was baked into the image, and a skew across this boundary
      # is not obvious from the outside — it shows up as a job running the wrong
      # framework's runner.
      - ./backend:/app
      # Same volume at the same path as the worker and the spawned runners, so
      # a workspace path means the same thing in all three.
      - stlc_storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8100"
    command: uvicorn app.executor.main:app --host 0.0.0.0 --port 8100


  # The static test target lives in docker-compose.override.yml. It is a local
  # fixture, and this file is also half of the production stack
  # (-f docker-compose.yml -f docker-compose.prod.yml), which does not load the
  # override — so defining it here shipped a test fixture to production.

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stlc_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_ENABLE_DEV_AUTH: ${NEXT_PUBLIC_ENABLE_DEV_AUTH:-false}
    depends_on:
      - backend

  # ── Nginx Proxy (HTTPS) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: stlc_nginx
    restart: unless-stopped
    # Host ports are variables so a shared server can move them without editing
    # this file. 443 is off-limits on the target host, so HTTPS defaults to
    # 12443. Only the left-hand (host) side moves — nginx still listens on 80
    # and 443 inside its own network namespace, where nothing can collide.
    #
    # Changing HTTPS_PORT also means changing the redirect in nginx.conf /
    # nginx.prod.conf, which cannot read environment variables and therefore
    # spells the port out.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-12443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

networks:
  # Fixed name so AUTOMATION_DOCKER_NETWORK does not have to track the compose
  # project prefix — the executor passes this straight to `docker run --network`.
  test_targets:
    name: stlc_test_targets

volumes:
  pg_data:
  redis_data:
  stlc_storage:
