name: Security Scan

on:
  push:
    branches: [main, develop, "security/**", "feature/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly full scan every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for uploading SARIF to GitHub Security tab

jobs:
  # ── Backend: dependency audit ───────────────────────────────────────────────
  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit \
            --requirement requirements.txt \
            --severity high \
            --format json \
            --output pip-audit-report.json || true
          pip-audit \
            --requirement requirements.txt \
            --severity high

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json

  # ── Frontend: dependency audit ──────────────────────────────────────────────
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run npm audit (high+critical only)
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit-report.json || npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json

  # ── Backend: SAST — Bandit ──────────────────────────────────────────────────
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[sarif]

      - name: Run Bandit
        working-directory: backend
        run: |
          bandit \
            --recursive app \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero
          # Exit non-zero on HIGH severity findings
          bandit \
            --recursive app \
            --severity-level high \
            --confidence-level high \
            --format txt

      - name: Upload Bandit SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/bandit-results.sarif
          category: bandit

  # ── Frontend: SAST — ESLint security plugin ────────────────────────────────
  eslint-security:
    name: JavaScript SAST (eslint-plugin-security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies + security plugin
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm install --no-save eslint-plugin-security eslint-plugin-no-secrets

      - name: Run ESLint security scan
        working-directory: frontend
        run: |
          npx eslint \
            --plugin security \
            --plugin no-secrets \
            --rule 'security/detect-object-injection: warn' \
            --rule 'security/detect-non-literal-regexp: warn' \
            --rule 'security/detect-possible-timing-attacks: error' \
            --rule 'no-secrets/no-secrets: error' \
            --format json \
            --output-file eslint-security-report.json \
            "src/**/*.{ts,tsx,js,jsx}" || true
          npx eslint \
            --plugin security \
            --rule 'security/detect-possible-timing-attacks: error' \
            "src/**/*.{ts,tsx,js,jsx}"

      - name: Upload ESLint security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-report
          path: frontend/eslint-security-report.json

  # ── Semgrep SAST ───────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep \
            --config "p/python" \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/jwt" \
            --config "p/secrets" \
            --sarif \
            --output semgrep-results.sarif \
            --severity ERROR \
            backend/app
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ── Backend: pytest security suite ─────────────────────────────────────────
  security-tests:
    name: Security test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stlc_test
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest-asyncio

      - name: Run security test suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/stlc_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: local
          APP_SECRET_KEY: ci-test-secret-key-not-for-production-32x
          RAG_ENABLED: "false"
        run: |
          pytest tests/test_security.py \
                 tests/test_security_hardening.py \
                 tests/test_session_hardening.py \
                 tests/test_ai_security_hardening.py \
                 tests/test_authorization.py \
                 -v --tb=short
