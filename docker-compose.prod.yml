# Production override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from base docker-compose.yml:
#   - No source-code bind mounts (image is the artifact)
#   - No --reload flag on uvicorn
#   - Backend runs as non-root user (uid 1000)
#   - Frontend runs `next start` (pre-built image), not `next dev`
#   - Celery Beat scheduler added for retention tasks
#   - All services have explicit memory limits
#   - No direct port exposure for db/redis (only via nginx)
#   - Health checks tuned for production restart cadence

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    ports: []   # Do not expose DB port externally in production
    deploy:
      resources:
        limits:
          memory: 2g

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    ports: []   # Do not expose Redis port externally in production
    deploy:
      resources:
        limits:
          memory: 512m

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    # 10001 is the appuser backend/Dockerfile creates and chowns /app to, NOT an
    # arbitrary non-root uid. Docker seeds a fresh named volume from the image's
    # ownership of the mount point, so stlc_storage comes up owned by 10001;
    # running as 1000 (as this did) left the process unable to write a single
    # upload, report or automation workspace into it.
    user: "10001:10001"
    volumes:
      - stlc_storage:/app/storage
      # No source bind mount — the built image is the artifact
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app
               --host 0.0.0.0
               --port 8000
               --workers 4
               --no-access-log"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DEV_SEED_USER_ENABLED: "false"
      NEXT_PUBLIC_ENABLE_DEV_AUTH: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # ── Celery Worker ─────────────────────────────────────────────────────────────
  worker:
    # Must match the backend: both write the same stlc_storage volume.
    user: "10001:10001"
    volumes:
      - stlc_storage:/app/storage
      # No source bind mount
    command: >
      celery -A app.worker.celery_app worker
        --loglevel=warning
        --concurrency=4
        --without-heartbeat
        --without-gossip
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Celery Beat (scheduled tasks) ───────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Same appuser as backend and worker — see the note on the backend service.
    user: "10001:10001"
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      DB_POOL_ENABLED: "false"
      APP_ENV: production
    volumes:
      - stlc_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.worker.celery_app beat
        --loglevel=warning
        --schedule /tmp/celerybeat-schedule
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    volumes: []     # No source bind mount in production
    command: npm start    # Uses pre-built .next/ in the image
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Nginx TLS Proxy ──────────────────────────────────────────────────────────
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pg_data:
  redis_data:
  stlc_storage:
  nginx_cache:
